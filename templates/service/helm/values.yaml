replicaCount: 1
image: {repository: ghcr.io/example/__SERVICE_NAME__, tag: "__VERSION__", pullPolicy: IfNotPresent}
serviceAccount: {create: true, name: __SERVICE_NAME__}
securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
service: {type: ClusterIP, port: 8000}
env: {SERVICE_NAME: __SERVICE_NAME__, SERVICE_VERSION: "__VERSION__", SERVICE_ENVIRONMENT: __ENVIRONMENT__}
